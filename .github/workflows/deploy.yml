name: Deploy CortexAI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, push and redeploy all 5 services
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          GATEWAY_SERVICE: ${{ secrets.GATEWAY_SERVICE }}
          AUTH_SERVICE: ${{ secrets.AUTH_SERVICE }}
          CHAT_SERVICE: ${{ secrets.CHAT_SERVICE }}
          AGENT_SERVICE: ${{ secrets.AGENT_SERVICE }}
          BILLING_SERVICE: ${{ secrets.BILLING_SERVICE }}
        run: |
          set -euo pipefail

          # format: ecr-name|dockerfile-path|ecs-service-name
          SERVICES=(
            "gateway|backend/gateway/Dockerfile|${GATEWAY_SERVICE}"
            "auth|backend/services/auth/Dockerfile|${AUTH_SERVICE}"
            "chat|backend/services/chat/Dockerfile|${CHAT_SERVICE}"
            "agent|backend/services/agent/Dockerfile|${AGENT_SERVICE}"
            "billing|backend/services/billing/Dockerfile|${BILLING_SERVICE}"
          )

          # 1) Build + push all images (build context = backend)
          for entry in "${SERVICES[@]}"; do
            IFS='|' read -r NAME DOCKERFILE SVC <<< "${entry}"
            IMAGE="${REGISTRY}/backend-${NAME}"
            echo "=== Building ${NAME} ==="
            docker build \
              -f "${DOCKERFILE}" \
              -t "${IMAGE}:latest" \
              -t "${IMAGE}:${GITHUB_SHA}" \
              backend
            docker push "${IMAGE}:latest"
            docker push "${IMAGE}:${GITHUB_SHA}"
          done

          # 2) Force new deployment on all ECS services
          for entry in "${SERVICES[@]}"; do
            IFS='|' read -r NAME DOCKERFILE SVC <<< "${entry}"
            echo "=== Redeploying ${NAME} ==="
            aws ecs update-service \
              --cluster "${ECS_CLUSTER}" \
              --service "${SVC}" \
              --force-new-deployment \
              --region "${AWS_REGION}" > /dev/null
          done

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
        run: |
          npm install
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 sync frontend/dist "s3://${{ secrets.S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"