services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./gateway/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE=http://auth:8001
      - CHAT_SERVICE=http://chat:8002
      - AGENT_SERVICE=http://agent:8003
      - BILLING_SERVICE=http://billing:8004
    depends_on:
      - redis
      - auth
      - chat
      - agent
      - billing

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./services/auth/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  chat:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - ./services/chat/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - ./services/agent/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - CHAT_SERVICE=http://chat:8002
      - AUTH_SERVICE=http://auth:8001
      - BILLING_SERVICE=http://billing:8004
    depends_on:
      - redis
      - chat
      - auth
      - billing

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    ports:
      - "8004:8004"
    env_file:
      - ./services/billing/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - CHAT_SERVICE=http://chat:8002
      - AUTH_SERVICE=http://auth:8001
    depends_on:
      - redis
      - chat
      - auth